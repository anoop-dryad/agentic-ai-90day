name: Agent CI

on:
    push:
        branches: [main]

# so a new push to a PR cancels the previous run (saves CI minutes)
concurrency:
    group: agent-ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint-and-test:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: phase4_project/stage6_deployment
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
                  cache: pip

            - name: Install dependencies
              run: pip install -e ".[dev]"

            - name: Lint (ruff)
              run: ruff check src/ tests/

            - name: Format check (ruff)
              run: ruff format --check src/ tests/

            - name: Test
              run: pytest -v

    docker-build:
        runs-on: ubuntu-latest
        needs: lint-and-test # only build if lint+test passed
        defaults:
            run:
                working-directory: phase4_project/stage6_deployment
        steps:
            - uses: actions/checkout@v4

            - name: Build MCP server image (verify it builds — not pushed)
              run: docker build -t canopy-mcp-server:ci .
